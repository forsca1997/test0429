<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>古窑 · 窑火着色 | 初中化学交互教学</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #2a1a0c;
            background-image: radial-gradient(circle at 20% 20%, #5a3e22, #1f1407);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', '华文楷体', 'KaiTi', '楷体', 'STFangsong', serif;
            padding: 20px;
        }

        .ancient-scroll {
            background: #fef5e3;
            background-image: linear-gradient(145deg, #fff2df 0%, #f7e8cf 100%);
            border-radius: 72px 72px 64px 64px;
            border: 10px double #aa7a4a;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.6), inset 0 0 35px rgba(210, 160, 80, 0.3);
            padding: 20px 28px 32px;
            max-width: 1300px;
            width: 100%;
        }

        .title-section {
            text-align: center;
            margin-bottom: 18px;
        }

        .title-section h1 {
            font-size: 2.8rem;
            color: #6b3c1c;
            letter-spacing: 8px;
            text-shadow: 3px 3px 0 #e9cf97;
            border-bottom: 2px dashed #c28a5c;
            display: inline-block;
            padding: 0 25px 8px;
        }

        .chinese-tag {
            text-align: right;
            font-size: 1rem;
            color: #b45a2e;
            margin-top: -8px;
            letter-spacing: 2px;
        }

        .workspace {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            margin-top: 12px;
        }

        .kiln-stage {
            flex: 2;
            min-width: 520px;
            background: #3a2a1a;
            border-radius: 65px 65px 55px 55px;
            padding: 8px;
            box-shadow: inset 0 0 12px #1c1308, 0 16px 28px black;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #4c371f;
            border-radius: 48px;
            border: 3px solid #b8854b;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0,0,0,0.5);
        }

        .controls-side {
            flex: 1.2;
            min-width: 240px;
            background: rgba(220, 190, 140, 0.45);
            backdrop-filter: blur(14px);
            border-radius: 48px;
            border: 2px solid #dbb87a;
            padding: 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.4);
        }

        .oxygen-panel {
            background: #e7d9bd;
            border-radius: 36px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: inset 0 1px 6px #ab8a56, 0 6px 10px rgba(0,0,0,0.2);
        }

        .oxygen-panel label {
            font-weight: bold;
            font-size: 1.3rem;
            color: #4e2b14;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #b48b54;
            border-radius: 10px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #d4822b;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px #ffb453;
            border: none;
        }

        .oxi-value {
            margin-top: 10px;
            font-size: 1.1rem;
            background: #2a241a;
            display: inline-block;
            padding: 4px 18px;
            border-radius: 60px;
            color: #fad68f;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .action-btn {
            background: #c9ab7b;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'KaiTi', serif;
            padding: 12px 8px;
            border-radius: 60px;
            color: #2c1a0a;
            box-shadow: 0 5px 0 #7a532e;
            cursor: pointer;
            transition: 0.07s linear;
            letter-spacing: 2px;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #7a532e;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #b49564;
        }

        @media (max-width: 780px) {
            .kiln-stage { min-width: 380px; }
            .title-section h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="ancient-scroll">
    <div class="title-section">
        <h1>🏺 窑火着色 · 天工造化</h1>
        <div class="chinese-tag">⚱️ 火候为骨 · 气氛为魂</div>
    </div>
    <div class="workspace">
        <div class="kiln-stage">
            <canvas id="kilnCanvas" width="700" height="460" style="width:100%; height:auto; max-width:700px; aspect-ratio:700/460"></canvas>
        </div>
        <div class="controls-side">
            <div class="oxygen-panel">
                <label>🔥 窑内氧气量 <span style="font-size:1rem;">( 助燃风气 )</span></label>
                <input type="range" id="oxygenSlider" class="slider" min="0" max="100" value="85" step="1">
                <div class="oxi-value" id="oxygenPercent">氧气浓度 : 85%</div>
                <div style="font-size:13px; margin-top:6px;">👆 高氧→红陶 &nbsp;&nbsp; 低氧→青灰 &nbsp;&nbsp; 封闭→玄黑</div>
            </div>
            <div class="btn-group">
                <button id="waterSealBtn" class="action-btn">💧 窑顶淋水 · 水火既济</button>
                <button id="woodSealBtn" class="action-btn">🌿 添加湿柴 · 闷窑取黑</button>
            </div>
        </div>
    </div>
    <footer>🎋 <em>天工开物 · 陶埏篇</em>  |  火路通明则红，水润窑闷则青黑</footer>
</div>

<script>
    (function() {
        const canvas = document.getElementById('kilnCanvas');
        const ctx = canvas.getContext('2d');
        const oxygenSlider = document.getElementById('oxygenSlider');
        const oxygenPercentSpan = document.getElementById('oxygenPercent');
        const waterBtn = document.getElementById('waterSealBtn');
        const woodBtn = document.getElementById('woodSealBtn');

        const W = 700, H = 460;
        canvas.width = W;
        canvas.height = H;

        // 核心变量
        let oxygenLevel = 85;
        let manualWaterEffect = 0;
        let manualWoodEffect = 0;
        
        let flameParticles = [];
        let smokeParticles = [];
        let steamParticles = [];
        
        // 火焰位置：大幅度下移至窑底
        const FIRE_CENTER_X = 360;
        const FIRE_BASE_Y = 385;
        
        // 陶器：体积增大 (宽高增加)，位置上移至窑顶附近
        const POT_X = 280, POT_Y = 100, POT_W = 140, POT_H = 138;
        
        // 气氛判定 (仅用于陶器颜色)
        function getAtmosphereType() {
            let effectiveOxy = oxygenLevel;
            let woodIntensity = Math.min(1, manualWoodEffect * 1.2);
            if (woodIntensity > 0.2) return 'black';
            if (effectiveOxy <= 25) return 'black';
            let waterIntensity = Math.min(0.8, manualWaterEffect * 1.0);
            if (waterIntensity > 0.15 && effectiveOxy < 70) return 'gray';
            if (effectiveOxy >= 65) return 'red';
            if (effectiveOxy >= 30 && effectiveOxy < 65) return 'gray';
            return 'black';
        }
        
        function getPotteryColor() {
            const type = getAtmosphereType();
            if (type === 'red') return { main: '#bc5a2c', light: '#de7846', dark: '#9e401e', rim: '#c96f3a' };
            if (type === 'gray') return { main: '#737d7a', light: '#919e99', dark: '#555e5b', rim: '#818c88' };
            return { main: '#3e3b37', light: '#5f5850', dark: '#2a2622', rim: '#4e4842' };
        }
        
        // 计算当前火焰体积系数 (氧气越高火焰体积反而更集中，但为了视觉上减小总体大小，我们限制最大size)
        function getFlameSizeFactor() {
            // 氧气越高，火焰越精炼（体积略微减小），但为了满足“火焰体积减小”的最终要求，整体压低
            let base = 0.55;   // 整体减小火焰体积
            let oxygenFactor = Math.min(1.2, oxygenLevel / 80);
            return base * (0.8 + oxygenFactor * 0.3);
        }
        
        // 烟雾生成量：氧气浓度越高，烟雾越少
        function getSmokeDensity() {
            if (oxygenLevel >= 75) return 0.15;
            if (oxygenLevel >= 50) return 0.55;
            if (oxygenLevel >= 25) return 1.0;
            return 1.6;
        }
        
        // ----- 火焰粒子 (体积减小) -----
        function createFlame(baseX, baseY) {
            let oxygenFactor = Math.min(1.0, oxygenLevel / 100);
            const atmos = getAtmosphereType();
            if (atmos === 'black') oxygenFactor = 0.15;
            else if (atmos === 'gray') oxygenFactor = 0.5;
            let brightness = Math.min(1, oxygenFactor * 1.2);
            let hue = 28 + (1 - brightness) * 12;
            let sat = 75 + brightness * 15;
            let light = 45 + brightness * 30;
            let sizeScale = getFlameSizeFactor() * (0.7 + brightness * 0.6);
            return {
                x: baseX + (Math.random() - 0.5) * 48,
                y: baseY - Math.random() * 20,
                vx: (Math.random() - 0.5) * 0.8,
                vy: -Math.random() * 2.2 - 1.0,
                life: 0.5 + Math.random() * 0.8,
                maxLife: 0.8 + Math.random() * 0.7,
                size: 3.5 * sizeScale + Math.random() * 6,
                alpha: 0.7 + Math.random() * 0.25,
                color: `hsl(${hue}, ${sat}%, ${light}%)`,
            };
        }
        
        function createSmoke(baseX, baseY, isHeavy = false) {
            let density = getSmokeDensity();
            let sizeMult = (isHeavy ? 1.5 : 1.0) * density;
            let alphaMult = (isHeavy ? 0.9 : 0.6) * Math.min(1.2, density);
            return {
                x: baseX + (Math.random() - 0.5) * 46,
                y: baseY - Math.random() * 18,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 1.6 - 0.6,
                life: 0.9 + Math.random() * 1.4,
                maxLife: 1.3 + Math.random() * 1.5,
                size: 5 * sizeMult + Math.random() * 14,
                alpha: 0.4 * alphaMult + Math.random() * 0.4,
                color: `rgba(30, 22, 14, ${0.6 + Math.random() * 0.3})`,
            };
        }
        
        function createSteam(baseX, baseY) {
            return {
                x: baseX + (Math.random() - 0.5) * 50,
                y: baseY - Math.random() * 18,
                vx: (Math.random() - 0.5) * 0.6,
                vy: -Math.random() * 1.4 - 0.5,
                life: 0.8 + Math.random() * 1.1,
                maxLife: 1.0 + Math.random() * 1.3,
                size: 4 + Math.random() * 12,
                alpha: 0.4 + Math.random() * 0.4,
                color: `rgba(210, 220, 235, ${0.5 + Math.random() * 0.4})`,
            };
        }
        
        function updateParticles() {
            const atmos = getAtmosphereType();
            let flameSpawnRate = 5;
            let smokeSpawnRateBase = 0.8;
            let heavySmoke = false;
            
            if (atmos === 'red') { flameSpawnRate = 6; smokeSpawnRateBase = 0.3; heavySmoke = false; }
            else if (atmos === 'gray') { flameSpawnRate = 4; smokeSpawnRateBase = 1.4; heavySmoke = true; }
            else { flameSpawnRate = 2.5; smokeSpawnRateBase = 2.2; heavySmoke = true; }
            
            if (manualWoodEffect > 0.05) {
                smokeSpawnRateBase += 2.5 * manualWoodEffect;
                heavySmoke = true;
                flameSpawnRate = Math.max(1.2, flameSpawnRate - 1);
            }
            if (manualWaterEffect > 0.05) {
                smokeSpawnRateBase += 1.2 * manualWaterEffect;
            }
            
            // 根据氧气浓度动态调整烟雾产生量 (高氧烟雾极少)
            let oxygenSmokeFactor = Math.max(0.2, 1.0 - oxygenLevel / 100);
            let finalSmokeRate = smokeSpawnRateBase * oxygenSmokeFactor;
            
            for (let i = 0; i < flameSpawnRate; i++) if (Math.random() < 0.8) flameParticles.push(createFlame(FIRE_CENTER_X, FIRE_BASE_Y));
            for (let i = 0; i < finalSmokeRate; i++) {
                if (Math.random() < 0.7) smokeParticles.push(createSmoke(FIRE_CENTER_X, FIRE_BASE_Y, heavySmoke));
                if (Math.random() < 0.35) smokeParticles.push(createSmoke(380, 180, false));
            }
            if (manualWaterEffect > 0.05) {
                for (let i = 0; i < 2.0; i++) if (Math.random() < 0.65) steamParticles.push(createSteam(FIRE_CENTER_X - 20, FIRE_BASE_Y - 28));
            }
            
            // 更新粒子
            for (let i=flameParticles.length-1; i>=0; i--) {
                let p = flameParticles[i];
                p.life -= 0.016;
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.016;
                if (p.life <= 0 || p.y < 120 || p.x < 100 || p.x > 620) flameParticles.splice(i,1);
            }
            for (let i=smokeParticles.length-1; i>=0; i--) {
                let p = smokeParticles[i];
                p.life -= 0.012;
                p.x += p.vx; p.y += p.vy;
                p.vy -= 0.01;
                if (p.life <= 0 || p.y < 70) smokeParticles.splice(i,1);
            }
            for (let i=steamParticles.length-1; i>=0; i--) {
                let p = steamParticles[i];
                p.life -= 0.014;
                p.x += p.vx; p.y += p.vy;
                p.vy -= 0.008;
                if (p.life <= 0 || p.y < 80) steamParticles.splice(i,1);
            }
            if (flameParticles.length > 200) flameParticles = flameParticles.slice(-180);
            if (smokeParticles.length > 200) smokeParticles = smokeParticles.slice(-170);
            if (steamParticles.length > 100) steamParticles = steamParticles.slice(-90);
        }
        
        // 绘制古窑 + 大陶罐 (无文字)
        function drawKilnAndPottery() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#4e3520';
            ctx.fillRect(0, 0, W, H);
            for(let i=0;i<50;i++) {
                ctx.beginPath();
                ctx.moveTo(i*22, 0); ctx.lineTo(i*22-18, H);
                ctx.strokeStyle = '#6c5033';
                ctx.lineWidth=1; ctx.stroke();
            }
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#221a0c';
            ctx.fillStyle = '#896942';
            ctx.beginPath();
            ctx.moveTo(110, 290);
            ctx.lineTo(590, 290);
            ctx.lineTo(600, 390);
            ctx.lineTo(100, 390);
            ctx.fill();
            ctx.strokeStyle = '#55371b';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(350, 248, 238, 80, 0, 0, Math.PI*2);
            ctx.fillStyle = '#a47e53';
            ctx.fill();
            ctx.strokeStyle = '#644728';
            ctx.stroke();
            for(let i=0;i<5;i++) {
                let yy = 258 + i*18;
                ctx.beginPath();
                ctx.moveTo(160, yy); ctx.lineTo(540, yy);
                ctx.strokeStyle = '#826e48';
                ctx.stroke();
            }
            // 火膛 (位置下移)
            ctx.fillStyle = '#281f12';
            ctx.fillRect(FIRE_CENTER_X-50, FIRE_BASE_Y-24, 100, 52);
            ctx.strokeStyle = '#b4632c';
            ctx.strokeRect(FIRE_CENTER_X-50, FIRE_BASE_Y-24, 100, 52);
            ctx.fillStyle = '#6a4a2a';
            for(let i=0;i<3;i++) ctx.fillRect(FIRE_CENTER_X-34+i*26, FIRE_BASE_Y-14, 14, 26);
            
            // 窑顶气孔
            for(let k=0;k<3;k++) {
                let xh = 330 + k*28;
                let yh = 185;
                ctx.beginPath();
                ctx.arc(xh, yh, 5, 0, Math.PI*2);
                ctx.fillStyle = '#cbb27a';
                ctx.fill();
                ctx.fillStyle = '#5e401f';
                ctx.beginPath();
                ctx.arc(xh-1, yh-1, 2, 0, Math.PI*2);
                ctx.fill();
            }
            
            // ========= 双耳陶罐 (体积增大，位置极高) =========
            const potteryColors = getPotteryColor();
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            // 底足
            ctx.beginPath();
            ctx.ellipse(POT_X+POT_W/2, POT_Y+POT_H-14, 56, 18, 0, 0, Math.PI*2);
            ctx.fillStyle = potteryColors.dark;
            ctx.fill();
            // 罐身渐变 (丰腴)
            let grad = ctx.createLinearGradient(POT_X+15, POT_Y, POT_X+POT_W-15, POT_Y+POT_H);
            grad.addColorStop(0, potteryColors.light);
            grad.addColorStop(1, potteryColors.main);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(POT_X+26, POT_Y+14);
            ctx.quadraticCurveTo(POT_X+POT_W/2, POT_Y-6, POT_X+POT_W-26, POT_Y+14);
            ctx.lineTo(POT_X+POT_W-32, POT_Y+POT_H-26);
            ctx.quadraticCurveTo(POT_X+POT_W/2, POT_Y+POT_H+6, POT_X+32, POT_Y+POT_H-26);
            ctx.fill();
            // 罐口圆环
            ctx.beginPath();
            ctx.ellipse(POT_X+POT_W/2, POT_Y+10, 48, 16, 0, 0, Math.PI*2);
            ctx.fillStyle = potteryColors.rim;
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(POT_X+POT_W/2, POT_Y+6, 38, 10, 0, 0, Math.PI*2);
            ctx.fillStyle = potteryColors.dark;
            ctx.fill();
            // 双耳
            ctx.fillStyle = potteryColors.dark;
            ctx.beginPath();
            ctx.ellipse(POT_X+12, POT_Y+60, 22, 16, -0.45, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(POT_X+POT_W-12, POT_Y+60, 22, 16, 0.45, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = potteryColors.light;
            ctx.beginPath();
            ctx.ellipse(POT_X+4, POT_Y+60, 9, 11, -0.25, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(POT_X+POT_W-4, POT_Y+60, 9, 11, 0.25, 0, Math.PI*2);
            ctx.fill();
            // 弦纹装饰
            ctx.strokeStyle = potteryColors.dark;
            ctx.lineWidth = 1.8;
            for(let i=0;i<2;i++) {
                let yOff = POT_Y+88 + i*22;
                ctx.beginPath();
                ctx.ellipse(POT_X+POT_W/2, yOff, 50, 11, 0, 0, Math.PI*2);
                ctx.stroke();
            }
            
            ctx.restore();
            
            // 粒子绘制 (火焰缩小、烟雾动态)
            for(let p of smokeParticles) {
                ctx.save();
                ctx.globalAlpha = p.alpha * (p.life / p.maxLife);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.size*0.7, p.size*0.8, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
            for(let p of steamParticles) {
                ctx.save();
                ctx.globalAlpha = p.alpha * (p.life/p.maxLife)*0.8;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.size*0.65, p.size*0.75, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
            for(let p of flameParticles) {
                ctx.save();
                ctx.globalAlpha = p.alpha * (p.life/p.maxLife);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#e06b1f';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size*0.65, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#ffde9e';
                ctx.beginPath();
                ctx.arc(p.x-1, p.y-1, p.size*0.28, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        function updateEffectsDecay() {
            if (manualWaterEffect > 0) manualWaterEffect = Math.max(0, manualWaterEffect - 0.012);
            if (manualWoodEffect > 0) manualWoodEffect = Math.max(0, manualWoodEffect - 0.008);
        }
        
        function onWaterSeal() {
            manualWaterEffect = Math.min(1.0, manualWaterEffect + 0.75);
            if (oxygenLevel > 48) oxygenLevel = Math.max(35, oxygenLevel - 12);
            oxygenSlider.value = oxygenLevel;
            oxygenPercentSpan.innerText = `氧气浓度 : ${Math.floor(oxygenLevel)}%`;
        }
        
        function onWoodSeal() {
            manualWoodEffect = Math.min(1.0, manualWoodEffect + 0.88);
            oxygenLevel = Math.max(5, oxygenLevel - 32);
            oxygenSlider.value = oxygenLevel;
            oxygenPercentSpan.innerText = `氧气浓度 : ${Math.floor(oxygenLevel)}%`;
        }
        
        function onOxygenChange() {
            oxygenLevel = parseInt(oxygenSlider.value);
            oxygenPercentSpan.innerText = `氧气浓度 : ${oxygenLevel}%`;
        }
        
        function animate() {
            updateEffectsDecay();
            updateParticles();
            drawKilnAndPottery();
            requestAnimationFrame(animate);
        }
        
        oxygenSlider.addEventListener('input', onOxygenChange);
        waterBtn.addEventListener('click', onWaterSeal);
        woodBtn.addEventListener('click', onWoodSeal);
        
        for(let i=0;i<30;i++) flameParticles.push(createFlame(FIRE_CENTER_X, FIRE_BASE_Y));
        animate();
    })();
</script>
</body>
</html>
